services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abm
      POSTGRES_PASSWORD: abm
      POSTGRES_DB: abm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abm -d abm"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://abm:abm@db:5432/abm
      CREATE_TABLES: "1"
      STATIC_DIR: /app/static
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
